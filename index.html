<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>essomat.exe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:min(800px,92vw);min-height:min(600px,92vh);display:flex;flex-direction:column;align-items:center;padding:60px 30px 20px;text-align:center}
#content{width:100%;flex:1;display:flex;flex-direction:column;align-items:center}
#text{font-size:clamp(22px,3vw,30px);line-height:1.35;max-width:700px;white-space:pre-line;margin-bottom:35px}
button{display:block;width:300px;min-height:68px;margin:10px auto;border:1px solid #333;border-radius:4px;background:#000;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
button:hover{background:#222}button:active{transform:scale(.98)}
#exit{width:225px;min-height:60px;margin-top:auto}.hidden{display:none!important}.loading{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
</style>
</head>
<body>
<main class="app">
<section id="content">
<div id="text"></div>
<button id="start">SPRAWDŹ ESSĘ</button>
<div id="answers" class="hidden">
<button id="yes">TAK</button><button id="no">NIE</button>
</div>
</section>
</main>
<script>
const pytania=[
"Czy podoba ci się dzisiejsza pogoda?",
"Czy głaskałeś/aś dzisiaj kota?",
"Czy piłeś/aś lub planujesz dzisiaj cosik wypić?",
"Czy grałeś/aś dzisiaj w POE?",
"Czy zbierałeś/aś dzisiaj maliny?",
"Czy obrażałeś/aś już dzisiaj ukraińców lub inne nacje?",
"Czy słuchałeś/aś dzisiaj Skolima?",
"Czy słuchałeś/aś dzisiaj metalu lub jednej z jego odmian?",
"Czy słuchałeś/aś dzisiaj Fagaty?",
"Czy biegałeś/aś już dzisiaj?",
"Czy planujesz jakąś zadymkę?",
"Czy masz ochotę zajebać sobie w nosek?",
"Czy zajebałbyś/zajebałabyś komuś z baniaka?"
];
let aktualnePytanie=0;
const text=document.getElementById("text"),start=document.getElementById("start"),answers=document.getElementById("answers"),yes=document.getElementById("yes"),no=document.getElementById("no"),exit=document.getElementById("exit");
start.onclick=rozpocznij;yes.onclick=no.onclick=odpowiedz;
exit.onclick=()=>{aktualnePytanie=0;answers.classList.add("hidden");start.classList.remove("hidden");text.classList.remove("loading");text.textContent=""};
function rozpocznij(){aktualnePytanie=0;start.classList.add("hidden");answers.classList.remove("hidden");text.textContent=pytania[0]}
function odpowiedz(){aktualnePytanie++;if(aktualnePytanie<pytania.length){text.textContent=pytania[aktualnePytanie]}else{answers.classList.add("hidden");text.textContent="Obliczanie poziomu essy...";text.classList.add("loading");setTimeout(losuj,3000)}}
function losuj(){
const liczba=Math.floor(Math.random()*101);let tekst;
if(liczba===0)tekst="essomat.exe przestało odpowiadać.";
else if(liczba<=10)tekst="Bracie... lub siostro słabiutko dzisiaj oh.";
else if(liczba<=20)tekst="Coś ty taki bez essy? Idź się przewietrz, mordeczko.";
else if(liczba<=30)tekst="Coś dzisiaj nie dymisz myszeczko!";
else if(liczba<=40)tekst="Całkiem spoko essa tbh.";
else if(liczba<=50)tekst="Całkiem spoko essunia wariacie, ale mogłaby być lepsza.";
else if(liczba<=60)tekst="Jest wysoko HELL YEAH!!!.";
else if(liczba<=70)tekst="ALE DZISIAJ DYMISZ COOOO!";
else if(liczba<=80)tekst="AŻ TAKA ESSA DZISIAJ ŁOOOOOT, DYMISZ TOTALNIE.";
else if(liczba<=90)tekst="CO TO JEST ZA ESSA??!! DYYMY DYMY DYMY";
else if(liczba<100)tekst="PRAWIE 100% ESSY JOOOOŁ LEECISZ DZISIAJ!!!!!!!";
else tekst="💯 ESSA ABSOLUTNA. NIE MAM PYTAŃ. MOŻNA ZAMYKAĆ PROGRAM.";
text.classList.remove("loading");text.textContent=`Twoja dzisiejsza essa wynosi ${liczba}%
${tekst}`;
}
</script>
</body>
</html>
