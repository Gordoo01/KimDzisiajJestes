<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>essomat.exe</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:min(800px,94vw);min-height:min(600px,92vh);display:flex;flex-direction:column;align-items:center;padding:40px 20px 25px;text-align:center}
#content{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
#text{font-size:clamp(32px,5vw,48px);line-height:1.3;font-weight:bold;max-width:700px;margin:0 auto 35px}
#text.start-hidden{display:none!important}
button{display:block;width:300px;min-height:68px;margin:10px auto;border:1px solid #333;border-radius:4px;background:#000;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
button:hover{background:#222}button:active{transform:scale(.98)}
.hidden{display:none!important}
#answers{width:100%;max-width:650px}
#answers.yesno button{width:300px;margin:10px auto}
#answers.colors{display:flex;flex-wrap:nowrap;justify-content:center;gap:8px;max-width:100%;overflow-x:auto}
#answers.colors button{flex:1 1 0;width:auto;min-width:0;margin:4px;padding:10px 6px;font-size:clamp(12px,2.3vw,17px);white-space:nowrap}
#progress{color:#888;font-size:14px;margin-top:20px}
.result{font-size:clamp(30px,5vw,48px)!important;font-weight:bold}
#resultImage{display:block;max-width:min(340px,80vw);max-height:300px;object-fit:contain;margin:0 auto 20px;border-radius:8px}
@media(max-width:420px){.app{padding:25px 8px}#answers.colors{gap:3px}#answers.colors button{padding:9px 3px;font-size:11px}}
</style>
</head>
<body>
<main class="app">
<section id="content">
  <div id="text" class="start-hidden"></div>
  <button id="start">SPRAWDŹ KIM DZISIAJ JESTEŚ</button>
  <img id="resultImage" class="hidden" alt="">
  <div id="answers" class="hidden"></div>
  <div id="progress"></div>
</section>
</main>
<script>
const pytania = [
  { tekst: "Czy czujesz się dzisiaj męcznnikiem?", typ: "taknie" },
  { tekst: "Czy piłeś/piłaś dzisiaj matche?", typ: "taknie" },
  { tekst: "Czy oszukałeś/oszukałaś dzisiaj kogoś?", typ: "taknie" },
  { tekst: "Czy korzystałeś/korzystałaś dzisiaj z AI?", typ: "taknie" },
  { tekst: "Czy zajebałeś/zajebałaś sobie dzisiaj w nosek?", typ: "taknie" },
  { tekst: "Czy paliłeś/paliłaś dzisiaj crack?", typ: "taknie" },
  { tekst: "Czy ktoś cię dzisiaj wkurwił?", typ: "taknie" },
  { tekst: "Czy wypiłeś/wypiłaś dzisiaj wódę lub inny wysokoprocentowy alkohol, ewentualnie pokaźną ilość browarów (minimum 5)?", typ: "taknie" },
  { tekst: "Czy zajebałbyś/zajebałabyś komuś dzisiaj z baniaka?", typ: "taknie" },
  { tekst: "Jakiego koloru masz dzisiaj włosy?", typ: "kolor", opcje: ["Blond", "Brązowe", "Czarne", "Białe", "Inny kolor"] }
];
const wyniki = [
  { tekst: "Dzisaj jesteś dyniom", obraz: "dynia" },
  { tekst: "Dzisiaj jesteś pajonkiem", obraz: "pajonk" },
  { tekst: "Dzisiaj jest zębaczem", obraz: "zebacz" },
  { tekst: "Dzisiaj jestem smutym poro", obraz: "porosad" },
  { tekst: "Dzisiaj jesteś wesołym poro", obraz: "" },
  { tekst: "Dzisiaj jesteś oszustem", obraz: "oszust" },
  { tekst: "Dzisiaj jesteś Bradem Pittem", obraz: "bradpitt" },
  { tekst: "Dzisiaj jesteś UltraMad", obraz: "ultramad" },
  { tekst: "Dzisiaj jesteś szponcicielem", obraz: "szpont" }
];
const text = document.getElementById("text");
const start = document.getElementById("start");
const answers = document.getElementById("answers");
const progress = document.getElementById("progress");
const resultImage = document.getElementById("resultImage");
let kolejka = [], indeks = 0;

function tasuj(tablica) {
  const wynik = [...tablica];
  for (let i = wynik.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [wynik[i], wynik[j]] = [wynik[j], wynik[i]];
  }
  return wynik;
}
function rozpocznij() {
  text.classList.remove("start-hidden");
  kolejka = tasuj(pytania);
  indeks = 0;
  start.classList.add("hidden");
  resultImage.classList.add("hidden");
  resultImage.removeAttribute("src");
  answers.classList.remove("hidden");
  pokazPytanie();
}
function pokazPytanie() {
  if (indeks >= kolejka.length) return pokazWynik();
  const pytanie = kolejka[indeks];
  text.classList.remove("result");
  text.textContent = pytanie.tekst;
  answers.innerHTML = "";
  answers.className = pytanie.typ === "kolor" ? "colors" : "yesno";
  const opcje = pytanie.typ === "kolor" ? pytanie.opcje : ["TAK", "NIE"];
  opcje.forEach(opcja => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = opcja;
    button.addEventListener("click", () => { indeks++; pokazPytanie(); });
    answers.appendChild(button);
  });
  progress.textContent = `Pytanie ${indeks + 1} z ${kolejka.length}`;
}
