<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>essomat.exe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center}
.app{width:min(800px,92vw);min-height:min(600px,92vh);display:flex;flex-direction:column;align-items:center;padding:60px 30px 20px;text-align:center}
#content{width:100%;flex:1;display:flex;flex-direction:column;align-items:center}
#text{font-size:clamp(22px,3vw,30px);line-height:1.35;max-width:700px;white-space:pre-line;margin-bottom:35px}
button{display:block;width:300px;min-height:68px;margin:10px auto;border:1px solid #333;border-radius:4px;background:#000;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
button:hover{background:#222}button:active{transform:scale(.98)}
#exit{width:225px;min-height:60px;margin-top:auto}.hidden{display:none!important}.loading{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}

.image-answers{
  width:100%;
  max-width:700px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:5px;
}
.image-choice{
  width:100%;
  aspect-ratio:1/1;
  padding:0;
  margin:0;
  border:2px solid #333;
  border-radius:6px;
  background:#000;
  overflow:hidden;
}
.image-choice:hover{border-color:#fff;background:#111}
.image-choice:active{transform:scale(.97)}
.image-choice img{display:block;width:100%;height:100%;object-fit:contain}
@media(max-width:600px){
  .image-answers{gap:8px}
  .image-choice{border-width:1px}
}


.text-answer{
  width:100%;
  max-width:560px;
  display:flex;
  gap:10px;
  margin:5px auto 0;
}
.text-answer input{
  flex:1;
  min-width:0;
  box-sizing:border-box;
  padding:14px 16px;
  border:2px solid #333;
  border-radius:6px;
  background:#080808;
  color:#fff;
  font:inherit;
  outline:none;
}
.text-answer input:focus{border-color:#fff}
.text-answer button{
  padding:14px 20px;
  border:2px solid #333;
  border-radius:6px;
  background:#111;
  color:#fff;
  cursor:pointer;
  font:inherit;
}
.text-answer button:hover{border-color:#fff}


.color-answers{
  width:100%;
  max-width:540px;
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:9px;
  margin:8px auto 0;
}
.color-choice{
  width:100%;
  aspect-ratio:1;
  min-width:0;
}
.color-choice{
  aspect-ratio:1;
  border-radius:50%;
  border:3px solid #222;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.color-choice:hover{border-color:#fff;transform:scale(1.06)}
.range-answer{
  width:100%;
  max-width:650px;
  margin:15px auto 0;
}
.range-answer input{
  width:100%;
  accent-color:#fff;
  cursor:pointer;
}
.range-value{
  font-size:28px;
  margin-top:8px;
}
.doors-answers{
  width:100%;
  max-width:620px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin:8px auto 0;
}
.door-choice{
  height:220px;
  border:4px solid #17130f;
  border-radius:4px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.35),transparent 18%,transparent 82%,rgba(0,0,0,.4)),
    repeating-linear-gradient(90deg,#3a2417 0,#4b2d1b 18px,#362116 36px);
  position:relative;
  cursor:pointer;
  box-shadow:
    inset 0 0 0 3px #68452b,
    inset 0 0 28px rgba(0,0,0,.85),
    0 5px 15px rgba(0,0,0,.5);
}
.door-choice:before{
  content:"";
  position:absolute;
  left:15%;
  right:15%;
  top:12%;
  height:29%;
  border:3px solid #26170f;
  background:rgba(15,9,6,.18);
  box-shadow:
    inset 0 0 0 2px rgba(112,75,45,.65),
    0 48px 0 -1px rgba(38,23,15,.95),
    0 48px 0 2px rgba(103,69,42,.6);
}
.door-choice:after{
  content:"";
  position:absolute;
  right:17px;
  top:52%;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#c3a15f;
  border:2px solid #5c4726;
  box-shadow:0 1px 2px #000, inset 1px 1px 2px rgba(255,255,255,.35);
}
.door-choice:hover{border-color:#fff;transform:translateY(-3px)}
.number-answer{
  width:100%;
  max-width:420px;
  margin:8px auto 0;
  display:flex;
  gap:10px;
}
.number-answer input{
  flex:1;
  box-sizing:border-box;
  padding:15px 16px;
  border:2px solid #333;
  border-radius:6px;
  background:#080808;
  color:#fff;
  font:inherit;
  font-size:22px;
  text-align:center;
  outline:none;
}
.number-answer input:focus{border-color:#fff}
.number-answer button{
  padding:15px 22px;
  border:2px solid #333;
  border-radius:6px;
  background:#111;
  color:#fff;
  cursor:pointer;
  font:inherit;
}
.number-answer button:hover{border-color:#fff}
@media(max-width:600px){
  .color-answers{gap:5px;max-width:96vw}
  .color-choice{border-width:2px}
  .doors-answers{gap:8px}
  .door-choice{height:170px}
}

</style>
</head>
<body>
<main class="app">
<section id="content">
<div id="text"></div>
<button id="start">SPRAWDŹ ESSĘ</button>
<div id="answers" class="hidden">
<button id="yes">TAK</button><button id="no">NIE</button>
</div>
</section>
</main>

  aktualnePytanie=0;
  odpowiedzi=[];

  // Pierwsze dwa pytania zawsze zostają na początku.
  // Wszystkie pozostałe losują kolejność przy każdym uruchomieniu.
  for(let i=pytania.length-1;i>2;i--){
    const j=2+Math.floor(Math.random()*(i-1));
    [pytania[i],pytania[j]]=[pytania[j],pytania[i]];
  }

  start.classList.add("hidden");
  pokazPytanie();
}

function usunObrazki(){
  const old=document.querySelector(".image-answers");
  if(old) old.remove();

  const textAnswer=document.querySelector(".text-answer");
  if(textAnswer) textAnswer.remove();

  const colorAnswers=document.querySelector(".color-answers");
  if(colorAnswers) colorAnswers.remove();

  const rangeAnswer=document.querySelector(".range-answer");
  if(rangeAnswer) rangeAnswer.remove();

  const doorsAnswers=document.querySelector(".doors-answers");
  if(doorsAnswers) doorsAnswers.remove();

  const numberAnswer=document.querySelector(".number-answer");
  if(numberAnswer) numberAnswer.remove();
}

function pokazPytanie(){
  const p=pytania[aktualnePytanie];
  usunObrazki();
  text.classList.remove("loading");
  text.textContent=p.text;

  if(p.type==="yesno"){
    answers.classList.remove("hidden");
    return;
  }

  answers.classList.add("hidden");

  if(p.type==="text"){
    const wrap=document.createElement("div");
    wrap.className="text-answer";

    const input=document.createElement("input");
    input.type="text";
    input.maxLength=80;
    input.placeholder="Wpisz słowo...";
    input.autocomplete="off";

    const btn=document.createElement("button");
    btn.type="button";
    btn.textContent="DALEJ";

    const submit=()=>{
      const value=input.value.trim();
      if(!value) return;
      odpowiedz(value);
    };

    btn.onclick=submit;
    input.addEventListener("keydown",(event)=>{
      if(event.key==="Enter") submit();
    });

    wrap.appendChild(input);
    wrap.appendChild(btn);
    content.appendChild(wrap);
    input.focus();
    return;
  }

  if(p.type==="color"){
    const grid=document.createElement("div");
    grid.className="color-answers";

    p.colors.forEach((color,index)=>{
      const btn=document.createElement("button");
      btn.className="color-choice";
      btn.type="button";
      btn.style.background=color;
      btn.title="Kolor "+(index+1);
      btn.onclick=()=>odpowiedz(color);
      grid.appendChild(btn);
    });

    content.appendChild(grid);
    return;
  }

  if(p.type==="range"){
    const wrap=document.createElement("div");
    wrap.className="range-answer";

    const input=document.createElement("input");
    input.type="range";
    input.min=p.min;
    input.max=p.max;
    input.value=50;

    const value=document.createElement("div");
    value.className="range-value";
    value.textContent="50%";

    input.oninput=()=>value.textContent=input.value+"%";

    wrap.appendChild(input);
    wrap.appendChild(value);
    content.appendChild(wrap);

    input.onchange=()=>odpowiedz(input.value);
    return;
  }

  if(p.type==="doors"){
    const grid=document.createElement("div");
    grid.className="doors-answers";

    for(let i=1;i<=3;i++){
      const btn=document.createElement("button");
      btn.className="door-choice";
      btn.type="button";
      btn.title="Drzwi "+i;
      btn.setAttribute("aria-label","Drzwi "+i);
      btn.style.setProperty("--door-no", '"'+i+'"');
      btn.onclick=()=>odpowiedz("DRZWI_"+i);
      grid.appendChild(btn);
    }

    content.appendChild(grid);
    return;
  }

  if(p.type==="number"){
    const wrap=document.createElement("div");
    wrap.className="number-answer";

    const input=document.createElement("input");
    input.type="number";
    input.min=p.min;
    input.max=p.max;
    input.step="1";
    input.placeholder="";

    const btn=document.createElement("button");
    btn.type="button";
    btn.textContent="DALEJ";

    const submit=()=>{
      if(input.value==="") return;
      const n=Math.max(p.min,Math.min(p.max,parseInt(input.value,10)||0));
      odpowiedz(String(n));
    };

    btn.onclick=submit;
    input.addEventListener("keydown",(event)=>{
      if(event.key==="Enter") submit();
    });

    wrap.appendChild(input);
    wrap.appendChild(btn);
    content.appendChild(wrap);
    input.focus();
    return;
  }

  if(p.type==="image"){
    const grid=document.createElement("div");
    grid.className="image-answers";

    p.images.forEach((src,index)=>{
      const btn=document.createElement("button");
      btn.className="image-choice";
      btn.type="button";
      btn.title="Peppo "+(index+1);

      const img=document.createElement("img");
      img.src=src;
      img.alt="Peppo "+(index+1);

      btn.appendChild(img);
      btn.onclick=()=>odpowiedz("PEPPO_"+(index+1));
      grid.appendChild(btn);
    });

    content.appendChild(grid);
  }
}

function odpowiedz(wartosc){
  odpowiedzi.push(wartosc);
  aktualnePytanie++;
  if(aktualnePytanie<pytania.length){
    pokazPytanie();
  }else{
    answers.classList.add("hidden");
    usunObrazki();
    text.textContent="Obliczanie poziomu essy...";
    text.classList.add("loading");
    setTimeout(losuj,3000);
  }
}

function losuj(){
  const liczba=Math.floor(Math.random()*101);
  let tekst;
  if(liczba===0)tekst="essomat.exe przestało odpowiadać.";
  else if(liczba<=10)tekst="Bracie... lub siostro słabiutko dzisiaj oh.";
  else if(liczba<=20)tekst="Coś ty taki bez essy? Idź się przewietrz, mordeczko.";
  else if(liczba<=30)tekst="Coś dzisiaj nie dymisz myszeczko!";
  else if(liczba<=40)tekst="Całkiem spoko essa tbh.";
  else if(liczba<=50)tekst="Całkiem spoko essunia wariacie, ale mogłaby być lepsza.";
  else if(liczba<=60)tekst="Jest wysoko HELL YEAH!!!.";
  else if(liczba<=70)tekst="ALE DZISIAJ DYMISZ COOOO!";
  else if(liczba<=80)tekst="AŻ TAKA ESSA DZISIAJ ŁOOOOOT, DYMISZ TOTALNIE.";
  else if(liczba<=90)tekst="CO TO JEST ZA ESSA??!! DYYMY DYMY DYMY";
  else if(liczba<100)tekst="PRAWIE 100% ESSY JOOOOŁ LEECISZ DZISIAJ!!!!!!!";
  else tekst="💯 ESSA ABSOLUTNA. NIE MAM PYTAŃ. MOŻNA ZAMYKAĆ PROGRAM.";

  text.classList.remove("loading");
  text.textContent=`Twoja dzisiejsza essa wynosi ${liczba}%
${tekst}`;
}
</script>
